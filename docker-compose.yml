version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: notekeeper_postgres
    restart: always
    environment:
      POSTGRES_DB: notekeeper
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notekeeper_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin:secure_password@db:5432/notekeeper
      JWT_SECRET_KEY: notekeeper-docker-secret-key-32-chars-long!
      JWT_REFRESH_SECRET_KEY: notekeeper-docker-refresh-secret-32-chars-long!
      ENVIRONMENT: production
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","https://*.vercel.app"]'

volumes:
  postgres_data:
